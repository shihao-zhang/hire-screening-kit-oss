name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: git ls-files -z -- '*.py' | xargs -0 python -m py_compile
      - name: Run offline smoke test
        run: bash tools/smoke_test.sh
      - name: Scan tracked files with public patterns
        run: env -u SENSITIVE_PATTERNS bash tools/sensitive_scan.sh
