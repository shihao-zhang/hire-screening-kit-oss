# 模型资源 ↔ 任务路由表（模板）
#
# 用途：把「哪个任务由谁执行、用哪个模型、什么 effort」从协议和脚本里抽出来。
# 换机器、换模型、换供应商时只改这一份，不用改协议正文。
#
# 初始化时怎么填：
#   1. 先盘点本机可用的执行通道，在 [resources] 下给每个通道起一个短名。
#      kind 取值：claude-session（当前会话直接处理）/ claude-subagent / codex-cli / agy / deterministic
#   2. 在 [tasks] 里把任务类型映射到通道。用不到的通道留空即可。
#   3. model 填 "auto" 表示「用该 CLI 当前配置的模型」，不要在表里抄模型 ID——
#      模型换代后协议与表都不用改，但**换模型前必须按批处理准则第 5 条做漂移校准**。
#   4. 未知任务不得自行选模型：先在 [tasks] 里补一行，再执行。
#
# 本地版（含真实模型 ID 或账号信息）放私有实例，不进本仓。

[meta]
version = 1
updated = "YYYY-MM-DD"
operator = ""
note = "本表是模型路由的唯一真源；协议与脚本只引用任务名，不写死模型 ID。"

# ── 执行通道 ────────────────────────────────────────────────────────────────

[resources.local_claude]
kind = "claude-session"
model = "current"          # current = 用当前会话模型，不另选
effort = "session-default"
note = "需要连续上下文的活：规则设计、归因、方案、文档、飞书交互、代码修改"

[resources.claude_subagent]
kind = "claude-subagent"
model = ""                 # 初始化时填，例如 sonnet / opus / haiku
effort = "medium"
note = "可并行的独立评审：词表归类、边界复核、漂移监测"

[resources.codex_cli]
kind = "codex-cli"
command = "codex exec -C <workspace> -s workspace-write"
model = "auto"             # auto = 以 codex 当前配置为准
effort = "medium"
note = "批量精读的执行通道；批大小与排序见 CODEX_PROTOCOL 批处理准则"

[resources.hetero_review]
kind = "agy"
model = ""                 # 初始化时填一个与初评不同模型家族的通道
effort = "high"
note = "高分复核与交叉审：优先与初评不同家族"

# ── 任务路由 ────────────────────────────────────────────────────────────────

[tasks]
# executor 可以是 [resources] 的键，也可以是 "deterministic"（不调用模型）。
probe_merge_score      = { executor = "deterministic", note = "探测/合并/评分/建档/同步/回读/护栏" }
vocab_triage           = { executor = "claude_subagent", effort = "medium", note = "只归类、不定档" }
routine_review         = { executor = "codex_cli", effort = "medium", batch = "10-12", note = "dossier 批量精读" }
high_score_review      = { executor = "hetero_review", effort = "high", note = "推荐且 ≥80，盲评，全量" }
boundary_review        = { executor = "claude_subagent", effort = "high", sample = "20%", note = "60-79 推荐与方向存疑" }
drift_monitor          = { executor = "codex_cli", effort = "medium", sample = "5/round", note = "历史档案盲评，不给旧结论" }
cross_model_audit      = { executor = "hetero_review", effort = "high", note = "只出对照，不覆盖结论" }
rule_design            = { executor = "local_claude", note = "规则改动与归因，人在环" }
attribution_analysis   = { executor = "local_claude", note = "归因队列只报现象，不替人下结论" }
doc_and_dashboard      = { executor = "local_claude", note = "看板/文档/消息文案" }
feishu_interaction     = { executor = "local_claude", note = "写表、评论、消息；写后必回读" }
code_change            = { executor = "local_claude", note = "改脚本/配置；非平凡改走 external_review" }
external_review        = { executor = "hetero_review", effort = "high", note = "非平凡代码/文档 review" }
