<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="972" viewBox="0 0 1200 972" role="img" aria-labelledby="title description">
  <title id="title">hire-screening-kit 架构图</title>
  <desc id="description">飞书招聘只读接入。投递进入私有工作区，由规则粗排和 LLM 精读，再经人工确认同步多维表格并回读。HM 复核并决策，HR 触达与跟进。面试官开展面试并记录面评与结论。人工评估和面试结果进入手动飞轮，形成回归护栏、归因和看板。规则调整先模拟，再由人确认。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#607e70"/>
    </marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#846b42"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif; fill: #263f36; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #496456; }
      .section { font-size: 27px; font-weight: 700; }
      .heading { font-size: 24px; font-weight: 650; }
      .detail { font-size: 20px; fill: #455d50; }
      .meta { font-size: 19px; fill: #51695b; }
      .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 18px; fill: #496456; }
      .flow { fill: none; stroke: #607e70; stroke-width: 2.4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #846b42; stroke-width: 2.3; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#feedback); }
      .return-label { font-size: 20px; fill: #6e5733; }
      .human-tag { font-size: 16px; font-weight: 700; fill: #7b5c37; }
    </style>
  </defs>

  <rect width="1200" height="972" fill="#f8f7f3"/>
  <text class="title" x="64" y="66">hire-screening-kit</text>
  <text class="subtitle" x="64" y="103">简历筛选架构 · 两层漏斗与数据飞轮</text>

  <g aria-label="系统边界">
    <rect x="64" y="133" width="340" height="118" rx="14" fill="#f3eee3"/>
    <text class="heading" x="85" y="169">私有实例</text>
    <text class="detail" x="85" y="201">岗位 TOML、精读 rubric</text>
    <text class="detail" x="85" y="229">简历与运行产物保存在仓外</text>

    <rect x="430" y="133" width="340" height="118" rx="14" fill="#edf1eb"/>
    <text class="heading" x="451" y="169">筛选内核</text>
    <text class="detail" x="451" y="201">配置驱动评分、精读合并</text>
    <text class="detail" x="451" y="229">标签、回归护栏与归因</text>

    <rect x="796" y="133" width="340" height="118" rx="14" fill="#eef0f4"/>
    <text class="heading" x="817" y="169">飞书适配</text>
    <text class="detail" x="817" y="201">招聘系统仅用 bot 读取</text>
    <text class="detail" x="817" y="229">经确认以 user 写表格／云文档</text>
  </g>

  <g aria-label="筛选主流程">
    <rect x="48" y="283" width="1104" height="224" rx="19" fill="#dce8df"/>
    <text class="section" x="64" y="324">筛选主流程</text>
    <text class="meta" x="1136" y="324" text-anchor="end">规则圈选 → LLM 精读 → 人工评估</text>

    <g>
      <rect x="64" y="349" width="192" height="130" rx="12" fill="#f4f7f2"/>
      <text class="heading" x="80" y="387">增量入库</text>
      <text class="detail" x="80" y="422">从飞书招聘拉取</text>
      <text class="detail" x="80" y="450">合并到私有工作区</text>
    </g>
    <g>
      <rect x="284" y="349" width="192" height="130" rx="12" fill="#f4f7f2"/>
      <text class="heading" x="300" y="387">规则粗排</text>
      <text class="detail" x="300" y="422">按岗位配置评分</text>
      <text class="detail" x="300" y="450">产出排名与精读网</text>
    </g>
    <g>
      <rect x="504" y="349" width="192" height="130" rx="12" fill="#f4f7f2"/>
      <text class="heading" x="520" y="387">LLM 精读</text>
      <text class="detail" x="520" y="422">为新进网者建档</text>
      <text class="detail" x="520" y="450">按 rubric 分批评阅</text>
    </g>
    <g>
      <rect x="724" y="349" width="192" height="130" rx="12" fill="#f4f7f2"/>
      <text class="heading" x="740" y="387">合并与同步</text>
      <text class="detail" x="740" y="422">人工确认后写入</text>
      <text class="detail" x="740" y="450">写后回读核验</text>
    </g>
    <g>
      <rect x="944" y="349" width="192" height="130" rx="12" fill="#f3eee3" stroke="#c8b290"/>
      <text class="heading" x="960" y="387">人工评估</text>
      <text class="human-tag" x="1120" y="385" text-anchor="end">HITL</text>
      <text class="detail" x="960" y="422">HM 复核并决策</text>
      <text class="detail" x="960" y="450">HR 触达与跟进</text>
    </g>

    <path class="flow" d="M258 414H280"/>
    <path class="flow" d="M478 414H500"/>
    <path class="flow" d="M698 414H720"/>
    <path class="flow" d="M918 414H940"/>
  </g>

  <path class="flow" d="M1040 481V519"/>
  <text class="meta" x="1054" y="508">进入面试</text>

  <g aria-label="人工面试">
    <rect x="892" y="524" width="244" height="84" rx="12" fill="#f3eee3" stroke="#c8b290"/>
    <text class="heading" x="909" y="556">人工面试</text>
    <text class="human-tag" x="1120" y="554" text-anchor="end">HITL</text>
    <text class="detail" x="909" y="586">面试官记录面评与结论</text>
  </g>

  <path class="return" d="M1040 610V644H186V710"/>
  <path d="M964 481V504H846V644" fill="none" stroke="#846b42" stroke-width="2.3" stroke-dasharray="7 6" stroke-linejoin="round"/>
  <text class="return-label" x="830" y="631" text-anchor="end">人工评估与面试结果回流</text>

  <g aria-label="手动运营飞轮">
    <text class="section" x="64" y="694">运营飞轮</text>
    <text class="meta" x="1136" y="693" text-anchor="end">操作者在场触发 · flywheel.sh</text>

    <g>
      <rect x="64" y="716" width="244" height="124" rx="12" fill="#edf1eb"/>
      <text class="heading" x="81" y="755">刷新阶段与标签</text>
      <text class="detail" x="81" y="787">汇总人工评估、面试信号</text>
      <text class="code" x="81" y="817">label_store.py</text>
    </g>
    <g>
      <rect x="340" y="716" width="244" height="124" rx="12" fill="#edf1eb"/>
      <text class="heading" x="357" y="755">检查回归护栏</text>
      <text class="detail" x="357" y="787">复核召回与进出网变化</text>
      <text class="code" x="357" y="817">harness.py</text>
    </g>
    <g>
      <rect x="616" y="716" width="244" height="124" rx="12" fill="#edf1eb"/>
      <text class="heading" x="633" y="755">生成归因队列</text>
      <text class="detail" x="633" y="787">列出漏召回等异常线索</text>
      <text class="code" x="633" y="817">attribution.py</text>
    </g>
    <g>
      <rect x="892" y="716" width="244" height="124" rx="12" fill="#eef0f4"/>
      <text class="heading" x="909" y="755">更新看板</text>
      <text class="detail" x="909" y="787">汇总本轮进展与指标</text>
      <text class="code" x="909" y="817">dashboard.py</text>
    </g>

    <path class="flow" d="M310 778H336"/>
    <path class="flow" d="M586 778H612"/>
    <path class="flow" d="M862 778H888"/>
  </g>

  <path class="return" d="M738 842V890H28V192H59"/>
  <text class="return-label" x="714" y="877" text-anchor="end">先模拟，再由 HM 确认规则变更</text>

  <path class="flow" d="M65 931H101"/>
  <text class="meta" x="113" y="938">工作流</text>
  <path class="return" d="M224 931H260"/>
  <text class="meta" x="272" y="938">反馈与人工校准</text>
</svg>
